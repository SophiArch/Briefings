<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" font-family="Lato, 'IBM Plex Sans', sans-serif">
  <rect width="1000" height="380" fill="#282a36"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f8f8f2"/>
    </marker>
  </defs>
  <g font-size="20" text-anchor="middle">
    <!-- change -->
    <rect x="30" y="140" width="160" height="80" rx="12" fill="#44475a" stroke="#bd93f9" stroke-width="2"/>
    <text x="110" y="175" fill="#f8f8f2">Change</text>
    <text x="110" y="200" fill="#8be9fd" font-size="15">prompt · model · docs</text>
    <!-- dev -->
    <rect x="240" y="40" width="180" height="80" rx="12" fill="#44475a" stroke="#f1fa8c" stroke-width="2"/>
    <text x="330" y="75" fill="#f8f8f2">Dev set</text>
    <text x="330" y="100" fill="#8be9fd" font-size="15">look, tune, repeat</text>
    <!-- test -->
    <rect x="240" y="240" width="180" height="80" rx="12" fill="#44475a" stroke="#50fa7b" stroke-width="2"/>
    <text x="330" y="275" fill="#f8f8f2">Test set</text>
    <text x="330" y="300" fill="#8be9fd" font-size="15">score once, report</text>
    <!-- gate -->
    <rect x="480" y="140" width="190" height="80" rx="12" fill="#44475a" stroke="#ff5555" stroke-width="2"/>
    <text x="575" y="175" fill="#f8f8f2">Release gate</text>
    <text x="575" y="200" fill="#8be9fd" font-size="15">pass rate + zero critical</text>
    <!-- ship -->
    <rect x="730" y="140" width="110" height="80" rx="12" fill="#44475a" stroke="#50fa7b" stroke-width="2"/>
    <text x="785" y="187" fill="#f8f8f2">Ship</text>
    <!-- monitor -->
    <rect x="870" y="140" width="110" height="80" rx="12" fill="#44475a" stroke="#ffb86c" stroke-width="2"/>
    <text x="925" y="187" fill="#f8f8f2">Monitor</text>
  </g>
  <g stroke="#f8f8f2" stroke-width="2" fill="none">
    <path d="M190,165 L238,95" marker-end="url(#a)"/>
    <path d="M420,80 C470,80 470,40 420,55" stroke="#f1fa8c" marker-end="url(#a)"/>
    <path d="M190,195 L238,270" marker-end="url(#a)"/>
    <path d="M420,280 L478,200" marker-end="url(#a)"/>
    <path d="M670,180 L728,180" marker-end="url(#a)"/>
    <path d="M840,180 L868,180" marker-end="url(#a)"/>
    <path d="M925,220 C925,360 110,360 110,222" stroke="#ffb86c" stroke-dasharray="6 6" marker-end="url(#a)"/>
    <path d="M575,140 C575,10 110,10 110,138" stroke="#ff5555" stroke-dasharray="6 6" marker-end="url(#a)"/>
  </g>
  <g font-size="15" text-anchor="middle">
    <text x="575" y="28" fill="#ff5555">BLOCK → fix and retry</text>
    <text x="520" y="352" fill="#ffb86c">new failures from production become new test cases</text>
  </g>
</svg>
