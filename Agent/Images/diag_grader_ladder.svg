<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Lato, 'IBM Plex Sans', sans-serif">
  <rect width="1000" height="420" fill="#282a36"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#6272a4"/>
    </marker>
  </defs>
  <!-- axis -->
  <line x1="60" y1="370" x2="950" y2="370" stroke="#6272a4" stroke-width="2" marker-end="url(#a)"/>
  <text x="950" y="400" fill="#6272a4" font-size="18" text-anchor="end">more nuance · more cost · less repeatable →</text>
  <!-- steps -->
  <g font-size="20" text-anchor="middle">
    <rect x="70" y="290" width="160" height="60" rx="10" fill="#44475a" stroke="#ff5555" stroke-width="2"/>
    <text x="150" y="327" fill="#f8f8f2">Exact match</text>
    <rect x="250" y="230" width="160" height="120" rx="10" fill="#44475a" stroke="#50fa7b" stroke-width="2"/>
    <text x="330" y="282" fill="#f8f8f2">Rule checks</text>
    <text x="330" y="310" fill="#8be9fd" font-size="16">must / must-not</text>
    <rect x="430" y="170" width="160" height="180" rx="10" fill="#44475a" stroke="#f1fa8c" stroke-width="2"/>
    <text x="510" y="252" fill="#f8f8f2">Similarity</text>
    <text x="510" y="280" fill="#8be9fd" font-size="16">"meaning match"</text>
    <rect x="610" y="110" width="160" height="240" rx="10" fill="#44475a" stroke="#50fa7b" stroke-width="2"/>
    <text x="690" y="222" fill="#f8f8f2">LLM judge</text>
    <text x="690" y="250" fill="#8be9fd" font-size="16">rubric + reference</text>
    <rect x="790" y="50" width="160" height="300" rx="10" fill="#44475a" stroke="#bd93f9" stroke-width="2"/>
    <text x="870" y="192" fill="#f8f8f2">Human review</text>
    <text x="870" y="220" fill="#8be9fd" font-size="16">ground truth</text>
  </g>
  <!-- verdict labels -->
  <g font-size="15" text-anchor="middle" fill="#ffb86c">
    <text x="150" y="282">IDs, codes only</text>
    <text x="330" y="222">cheap, brittle</text>
    <text x="510" y="162">topic ≠ truth</text>
    <text x="690" y="102">scales; must be calibrated</text>
    <text x="870" y="42">slow; calibrates the rest</text>
  </g>
</svg>
