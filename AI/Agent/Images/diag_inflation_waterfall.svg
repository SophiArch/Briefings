<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" font-family="Lato, 'IBM Plex Sans', sans-serif">
  <rect width="1000" height="420" fill="#282a36"/>
  <!-- y scale: recall 80% -> y=360, 100% -> y=60 ; 1pt = 15px -->
  <line x1="90" y1="360" x2="960" y2="360" stroke="#6272a4" stroke-width="1.5"/>
  <g fill="#6272a4" font-size="15" text-anchor="end">
    <text x="80" y="365">80%</text>
    <text x="80" y="215">90%</text>
    <text x="80" y="65">100%</text>
  </g>
  <line x1="90" y1="210" x2="960" y2="210" stroke="#44475a" stroke-dasharray="4 6"/>
  <line x1="90" y1="60" x2="960" y2="60" stroke="#44475a" stroke-dasharray="4 6"/>
  <text x="20" y="40" fill="#f8f8f2" font-size="17">Fraud recall (by count) on the test set</text>
  <!-- bars: 99.5 -> y = 360-(19.5*15)=67.5 ; 89.6 -> 216 ; 84.5 -> 292.5 -->
  <g font-size="18" text-anchor="middle">
    <rect x="140" y="67.5" width="170" height="292.5" fill="#ff5555" rx="4"/>
    <text x="225" y="57" fill="#f8f8f2">99.5%</text>
    <text x="225" y="390" fill="#f8f8f2">Agent's split</text>
    <text x="225" y="410" fill="#8be9fd" font-size="14">duplicates + shared cards</text>

    <rect x="410" y="67.5" width="170" height="148.5" fill="#44475a" stroke="#ffb86c" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
    <rect x="410" y="216" width="170" height="144" fill="#ffb86c" rx="4"/>
    <text x="495" y="206" fill="#f8f8f2">89.6%</text>
    <text x="495" y="145" fill="#ffb86c" font-size="15">−9.9 pts duplicates</text>
    <text x="495" y="390" fill="#f8f8f2">Deduplicated</text>
    <text x="495" y="410" fill="#8be9fd" font-size="14">random split</text>

    <rect x="680" y="216" width="170" height="76.5" fill="#44475a" stroke="#f1fa8c" stroke-width="2" stroke-dasharray="6 4" rx="4"/>
    <rect x="680" y="292.5" width="170" height="67.5" fill="#50fa7b" rx="4"/>
    <text x="765" y="282" fill="#f8f8f2">84.5%</text>
    <text x="765" y="258" fill="#f1fa8c" font-size="15">−5.1 pts same card</text>
    <text x="765" y="390" fill="#f8f8f2">Split by card</text>
    <text x="765" y="410" fill="#8be9fd" font-size="14">mirrors production</text>
  </g>
</svg>
